---
# PartOfSpeech OTS Software Requirements
#
# Requirements for the DemaConsulting.PartOfSpeech part-of-speech tagging library.

sections:
  - title: OTS Software Requirements
    sections:
      - title: PartOfSpeech Requirements
        requirements:
          - id: Ste100Mark-OTS-PartOfSpeech
            title: PartOfSpeech shall tag the part of speech of a word within its sentence context with a confidence.
            justification: |
              DemaConsulting.PartOfSpeech (Tagger.Default) is the context-aware part-of-speech tagger
              used by the Linting subsystem to decide whether a dictionary term is used in a supported
              grammatical role. Passing tests confirm the library returns the correct part of speech
              for the usages the project relies on. These tests tag noun, verb, adjective, and adverb
              usages (including a corpus of legal usages and a set of hard cases such as imperatives
              and noun-noun compounds), preserve confident determiner evidence, and treat
              low-confidence answers as inconclusive.
            tags: [ots]
            tests:
              - Resolve_NounUsage_ReturnsNoun
              - Resolve_VerbUsage_ReturnsVerb
              - Resolve_HardCase_ReturnsExpectedRole
              - Resolve_BelowThresholdOrOtherTag_ReturnsNull
              - Tagger_Default_ConfidenceSeparatesResolvedFromInconclusiveScenarios
              - Evaluate_LegalNounUsage_VerbOnlyDisallowedEntry_NotFlagged
              - Evaluate_ConfidentNounUsage_VerbOnlyDisallowedEntry_NotFlagged
              - Evaluate_LegalVerbUsage_NounOnlyDisallowedEntry_NotFlagged
              - Resolve_AdjectiveOrAdverbUsage_ReturnsMatchingRole
              - Resolve_DeterminerUsage_ReturnsDeterminerRole
              - Evaluate_DefaultResolver_AdjectiveAndAdverbEvidence_SelectsOrSuppresses
