---
# Software Unit Requirements for the PartOfSpeechResolver Class
#
# The PartOfSpeechResolver class decides whether a matched dictionary term is used in a supported
# grammatical role at a specific point in prose. A resolution is "confident" only when the part-of-speech
# classifier chose a noun, verb, adjective, or adverb for the matched word, or confidently chose a determiner as
# resolver-only evidence, in the context of its own sentence, with a
# confidence of at least 0.90 (the minimum confidence, set by the MinimumConfidence requirement).
# Other unsupported outcomes are "inconclusive". The unit has no OTS child requirement: the OTS PartOfSpeech
# requirement is a child of the Linting subsystem requirement Ste100Mark-Linting-DictionaryPos.

sections:
  - title: PartOfSpeechResolver Unit Requirements
    requirements:
      - id: Ste100Mark-PartOfSpeechResolver-NounVerbResolution
        title: >-
          The PartOfSpeechResolver class shall resolve a single-word dictionary-term match as a
          noun, verb, adjective, or adverb when the part-of-speech classifier classifies the word, in the context of
          its sentence, as a noun, verb, adjective, or adverb with at least the minimum confidence.
        justification: |
          Dictionary senses are restricted to a grammatical role, so the checker needs a
          trustworthy noun, verb, adjective, or adverb answer for the matched word. The classifier classifies the
          word using its sentence context, which recognizes noun phrases built from modifiers
          and imperative verbs that adjacent-word rules miss. A noun, verb, adjective, or adverb answer at or
          above the minimum confidence is "confident" and is the only kind of answer the
          checker may use to select or suppress a sense.
        tests:
          - Resolve_NounUsage_ReturnsNoun
          - Resolve_VerbUsage_ReturnsVerb
          - Resolve_AdjectiveOrAdverbUsage_ReturnsMatchingRole
          - Resolve_HardCase_ReturnsExpectedRole
          - HardCases_ContainsTwentySixCases

      - id: Ste100Mark-PartOfSpeechResolver-SentenceScope
        title: >-
          The PartOfSpeechResolver class shall classify a match using only the sentence that
          contains it.
        justification: |
          A segment can hold several sentences in which the same word has different roles.
          Classifying the wrong sentence would select the wrong sense and report or suppress
          the wrong finding.
        tests:
          - Resolve_MatchInSecondSentence_UsesThatSentenceOnly
          - Resolve_LowercaseContinuationAfterPeriod_StaysInSameSentence
          - Resolve_ContractionAndHyphen_TokenOffsetsMapToMatch
          - Resolve_ContractionAndHyphenWithRealTagger_ResolvesMatch

      - id: Ste100Mark-PartOfSpeechResolver-RepeatedWord
        title: >-
          The PartOfSpeechResolver class shall resolve the requested occurrence when the same
          word occurs more than once in a sentence.
        justification: |
          Resolving the wrong occurrence of a repeated word would report or suppress the wrong
          finding.
        tests:
          - Resolve_RepeatedWord_ResolvesRequestedOccurrence

      - id: Ste100Mark-PartOfSpeechResolver-MinimumConfidence
        title: >-
          The PartOfSpeechResolver class shall treat a tagger answer with a confidence below 0.90
          as inconclusive and a tagger answer with a confidence of exactly 0.90 as confident.
        justification: |
          The threshold is the strict threshold documented by the PartOfSpeech package (on its
          open test split the 0.1.0-beta.3 model answers 89.7% of noun-verb decisions with 4.6
          harmful errors per 1,000 answered decisions). A hand check of 110 samples, made with an
          earlier beta model of the package and not repeated for 0.1.0-beta.3, found no error at or
          above 0.90, while low-confidence verb answers on noun-noun compounds were wrong about
          half the time. The inclusive boundary must be exact so the documented value behaves as
          documented.
        tests:
          - Resolve_ConfidenceThreshold_BoundaryIsInclusive
          - MinimumConfidence_IsPackageStrictThreshold
          - Resolve_BelowThresholdOrOtherTag_ReturnsNull

      - id: Ste100Mark-PartOfSpeechResolver-UnknownWord
        title: >-
          The PartOfSpeechResolver class shall report a match as inconclusive when no tagged
          token covers the matched word.
        justification: |
          Without a tagged token for the matched word there is no answer, so any noun, verb, adjective, or adverb
          result would be a guess. The checker must fall back to reporting every sense as
          ambiguous.
        tests:
          - Resolve_NoTokensCoverMatch_ReturnsNull

      - id: Ste100Mark-PartOfSpeechResolver-WordNotInLexicon
        title: >-
          The PartOfSpeechResolver class shall report a match as inconclusive when the tagger
          tags the matched word as a noun, verb, or proper noun and the tagger's lexicon does not
          know the word, whatever the confidence.
        justification: |
          The PartOfSpeech package allows every tag for a word that its lexicon does not know, so
          a noun, verb, or proper-noun tag on such a word is a guess even at a high confidence.
          The package's guidance for rule checkers is to treat these tokens as unknown. The
          checker then reports every sense as ambiguous instead of acting on a guessed role. The
          package exception for tokens decided by a glossary or token constraint does not apply,
          because the resolver supplies neither.
        tests:
          - Resolve_UnknownWordNounVerbOrPropnTag_ReturnsNull
          - Resolve_UnknownWordAdjectiveTag_ReturnsAdjective
          - Resolve_UnknownWordWithRealTagger_ReturnsNullAndKnownWordResolves

      - id: Ste100Mark-PartOfSpeechResolver-OtherPartOfSpeech
        title: >-
          The PartOfSpeechResolver class shall preserve a confident determiner result as
          Determiner and report a match as inconclusive for every other part of speech outside
          noun, verb, adjective, adverb, and determiner.
        justification: |
          Determiner is useful resolver evidence because it is distinct from every supported
          dictionary sense role: it rules out all role-specific senses without becoming a
          configurable dictionary role. Other unsupported answers provide no reliable sense
          selection, so the conservative ambiguous report applies.
        tests:
          - Resolve_DeterminerUsage_ReturnsDeterminerRole
          - Resolve_UnsupportedPartOfSpeech_ReturnsNull

      - id: Ste100Mark-PartOfSpeechResolver-MultiWordMatch
        title: >-
          The PartOfSpeechResolver class shall report a match that covers more than one word as
          inconclusive.
        justification: |
          The classifier classifies single words, so it has no answer for a multi-word dictionary
          phrase as a whole. Using the answer for one word of the phrase would be misleading.
        tests:
          - Resolve_MultiWordMatch_ReturnsNull

      - id: Ste100Mark-PartOfSpeechResolver-ConsistentResults
        title: >-
          The PartOfSpeechResolver class shall give the same resolution for the same segment text
          and match however many times, and from however many threads, it is asked.
        justification: |
          Prose commonly holds several dictionary-term matches in one sentence, and lint runs
          check files in parallel. A resolution that varied between repeated or concurrent
          queries would make the lint findings non-deterministic.
        tests:
          - Resolve_RepeatedAndConcurrentQueries_ReturnSameResult
          - Resolve_ConcurrentSameSentence_ClassifiesOnce

      - id: Ste100Mark-PartOfSpeechResolver-NullSegmentText
        title: >-
          The PartOfSpeechResolver class shall reject a null segment text.
        justification: |
          A null segment text indicates a programming error in the caller. Failing fast with a
          clear exception prevents a misleading resolution.
        tests:
          - Resolve_NullSegmentText_ThrowsArgumentNullException

      - id: Ste100Mark-PartOfSpeechResolver-MatchOutsideText
        title: >-
          The PartOfSpeechResolver class shall reject a match that lies outside the segment text.
        justification: |
          A match outside the segment text indicates a programming error in the caller. Failing
          fast with a clear exception prevents a misleading resolution from an invalid position.
        tests:
          - Resolve_MatchOutsideText_ThrowsArgumentOutOfRangeException
          - Resolve_MatchLengthIntMaxValue_ThrowsArgumentOutOfRangeException
