---
# Linting Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the Ste100Mark Linting subsystem
# - The Linting subsystem spans the Markdown lint workflow and its configuration models
# - Subsystem requirements describe the externally visible lint behavior and rule enforcement

sections:
  - title: Linting Subsystem Requirements
    requirements:
      - id: Ste100Mark-Linting-WordLimits
        title: >-
          The Linting subsystem shall enforce ASD-STE100 Rule 4.1 sentence-length limits
          using the Rule 8.4-8.7 counting behavior implemented by the tool.
        justification: |
          Sentence length is one of the primary mechanical constraints in ASD-STE100.
          The tool must distinguish procedure and descriptive writing and count words
          consistently for parentheticals, quoted text, hyphenated words, number-plus-unit
          spans, and title-style proper-name sequences.
        tests:
          - Split_SingleSimpleSentence_ReturnsOneSentenceWithWordCount
          - Split_MultipleSentences_ReturnsEachSentenceSeparately
          - Split_ColonFollowedByCapital_TreatedAsSentenceTerminator
          - CountWords_ParentheticalSpan_CountsAsOneWord
          - Split_ParentheticalFormingCompleteSentence_ExtractedSeparately
          - CountWords_HyphenatedWord_CountsAsOneWord
          - CountWords_NumberWithUnit_CountsAsOneWord
          - CountWords_QuotedText_CountsAsOneWord
          - CountWords_TitleCaseSequence_CountsAsOneWord
          - Evaluate_SentenceWithinDescriptiveLimit_NoWordLimitDiagnostic
          - Evaluate_SentenceExceedingDescriptiveLimit_FlagsWordLimitDiagnostic
          - Evaluate_SentenceExceedingProcedureLimit_FlagsOnlyInProcedureMode

      - id: Ste100Mark-Linting-Semicolons
        title: >-
          The Linting subsystem shall report semicolons in prose as Rule 8.1 violations unless the
          rule is explicitly disabled.
        justification: |
          ASD-STE100 Rule 8.1 prohibits semicolons in controlled prose. The subsystem must
          report the violation consistently while still allowing projects to disable the
          check when they intentionally choose not to enforce that rule.
        tests:
          - Evaluate_Semicolon_FlagsSemicolonDiagnostic
          - Evaluate_SemicolonWithAllowSemicolons_NoDiagnostic
          - Run_FileWithSemicolon_ProducesFailureExitCode
          - Ste100Mark_LintFileWithSemicolon_ReportsErrorAndReturnsNonZero

      - id: Ste100Mark-Linting-Contractions
        title: >-
          The Linting subsystem shall report contractions in prose as Rule 4.2 violations unless
          the rule is explicitly disabled.
        justification: |
          ASD-STE100 Rule 4.2 requires expanded forms rather than contractions. The
          subsystem must detect common contraction forms and report them as build-breaking
          diagnostics when the check is enabled.
        tests:
          - Evaluate_Contraction_FlagsContractionDiagnostic
          - Evaluate_ContractionWithAllowContractions_NoDiagnostic

      - id: Ste100Mark-Linting-ParagraphAdvisory
        title: The Linting subsystem shall provide an advisory paragraph-length check with a configurable sentence cap.
        justification: |
          Long paragraphs reduce readability even when every individual sentence is legal.
          The advisory paragraph-length heuristic gives projects a configurable readability
          signal without treating it as an official ASD-STE100 rule.
        tests:
          - Evaluate_ParagraphExceedingSentenceCap_FlagsAdvisoryWarning
          - Evaluate_ParagraphLengthDisabled_NoAdvisoryDiagnostic
          - Evaluate_HeadingSegment_ExemptFromParagraphLengthCheck

      - id: Ste100Mark-Linting-PassiveVoiceAdvisory
        title: >-
          The Linting subsystem shall detect the passive-voice heuristic pattern, report it at
          default severity `Warn`, and let projects override that severity with the
          `rules.passive-voice` configuration knob.
        justification: |
          Active voice is often preferred for clear technical instructions, but passive-voice
          detection is heuristic rather than an official ASD-STE100 rule. Stating the detectable
          pattern boundary, the default `Warn` severity, and the controlling
          `rules.passive-voice` setting makes the advisory behavior objective and testable while
          still allowing projects to disable or escalate it.
        tests:
          - Evaluate_PassiveVoicePattern_FlagsAdvisoryAtConfiguredSeverity
          - Evaluate_PassiveVoiceOff_NoDiagnostic
          - Evaluate_PassiveVoiceError_FlagsAtErrorSeverity
          - Evaluate_WasOpened_StillFlagsPassiveVoice

      - id: Ste100Mark-Linting-ComplexVerbAdvisory
        title: >-
          The Linting subsystem shall detect perfect-tense and modal-perfect-tense verb patterns,
          report them at default severity `Warn`, and let projects override that severity with the
          `rules.complex-verb` configuration knob.
        justification: |
          Perfect and modal-perfect tense verb constructions (for example "has opened" or
          "would have written") are discouraged by ASD-STE100 in favor of simple present,
          past, or future tense verbs, but detecting them is heuristic rather than an official
          rule. Stating the detectable pattern boundary, the default `Warn` severity, and the
          controlling `rules.complex-verb` setting makes the advisory behavior objective and
          testable. The subsystem must also avoid double-reporting the same construction as both
          complex-verb and passive-voice findings.
        tests:
          - Evaluate_PerfectTensePattern_FlagsComplexVerbAdvisory
          - Evaluate_ModalPerfectTensePattern_FlagsComplexVerbAdvisory
          - Evaluate_ComplexVerbOff_NoDiagnostic
          - Evaluate_ComplexVerbOnlyInsideInlineCode_NoDiagnostic
          - Evaluate_HasBeenOpened_FlagsComplexVerbOnlyNotPassiveVoice

      - id: Ste100Mark-Linting-IngFormAdvisory
        title: >-
          The Linting subsystem shall detect mid-sentence words ending in `-ing`, report them at
          default severity `Warn`, and let projects override that severity with the
          `rules.ing-form` configuration knob.
        justification: |
          ASD-STE100 restricts "-ing" forms to technical nouns and adjectives, not
          present-participle verb forms, but distinguishing the two automatically is heuristic
          rather than an official rule. Stating the detectable pattern boundary, the default
          `Warn` severity, and the controlling `rules.ing-form` setting makes the advisory
          behavior objective and testable. The subsystem must still avoid flagging words that
          touch a sentence-ending period, since those are less likely to be present-participle
          verb forms.
        tests:
          - Evaluate_IngWordMidSentence_FlagsIngFormAdvisory
          - Evaluate_IngWordFollowedByPeriod_NotFlagged
          - Evaluate_IngWordPrecededByPeriod_NotFlagged
          - Evaluate_IngFormOff_NoDiagnostic
          - Evaluate_IngWordOnlyInsideInlineCode_NoDiagnostic

      - id: Ste100Mark-Linting-Dictionary
        title: >-
          The Linting subsystem shall enforce an effective disallow dictionary built from the
          configured dictionary sources.
        justification: |
          Vocabulary control is central to Simplified Technical English usage. The subsystem
          must merge the embedded illustrative baseline, any project-supplied dictionary file,
          and inline allow/disallow/ignore settings into one case-insensitive effective
          dictionary and report matched terms with suggested alternatives.
        tests:
          - Load_DefaultConfig_IncludesEmbeddedEntries
          - Load_MultiSenseEmbeddedTerm_IncludesBothSenses
          - Load_UseEmbeddedFalse_ExcludesEmbeddedEntries
          - Load_InlineDisallowEntry_AddedToMergedDictionary
          - Load_InlineDisallowOverridesEmbeddedTerm_ReplacesAllSenses
          - Load_AllowListedTerm_RemovedFromMergedDictionary
          - Load_IgnoreListedTerm_RemovedFromMergedDictionary
          - Load_ProjectDictionaryFile_MergedOverEmbedded
          - Load_MissingProjectDictionaryFile_ThrowsInvalidOperationException
          - TryGetEntry_DifferentCasing_MatchesEntry
          - Evaluate_DisallowedEmbeddedTerm_FlagsDiagnosticWithSuggestion
          - Evaluate_MultiWordPhrase_FlagsDiagnostic
          - Evaluate_DifferentCasing_StillFlagsDiagnostic
          - Evaluate_TermEmbeddedInLongerWord_NotFlagged
          - Evaluate_NoDisallowedTerms_ReturnsNoDiagnostics
          - Evaluate_InlineOverriddenTerm_UsesOverriddenSuggestion
          - Evaluate_AllowListedTerm_NotFlagged

      - id: Ste100Mark-Linting-DictionaryDisable
        title: >-
          The Linting subsystem shall let a project disable the dictionary/vocabulary check
          entirely via `dictionary.enabled: false`, defaulting to enabled, without requiring a
          dictionary file or the embedded baseline to be loaded.
        justification: |
          Some projects want the mechanical/structural ASD-STE100 checks (sentence length,
          semicolons, contractions, passive voice, and similar) without enforcing ASD-STE100
          vocabulary, for example because they have not licensed the standard's controlled
          dictionary or intentionally use domain vocabulary outside its scope. `UseEmbedded:
          false` only removes the embedded illustrative baseline while the dictionary check
          itself still runs against any remaining sources; `dictionary.enabled: false` is a
          distinct, coarser switch that skips the dictionary check altogether, avoiding any
          requirement to load or supply a dictionary at all.
        tests:
          - Run_DictionaryDisabled_SuppressesDictionaryFindingsButKeepsStructuralChecks
          - Run_NoDictionaryConfigSection_DictionaryCheckRunsByDefault

      - id: Ste100Mark-Linting-InlineCodeSpans
        title: >-
          The Linting subsystem shall retain inline code spans verbatim in reported prose,
          count each span as exactly one word toward Rule 4.1/8.4-8.7 limits, and exclude
          inline-code-span content from the semicolon, contraction, passive-voice,
          complex-verb, -ing form, and dictionary checks, while fenced code blocks remain
          fully excluded from prose.
        justification: |
          Inline code spans frequently carry literal technical values (for example, a CLI flag
          or file name) embedded mid-sentence. Stripping them breaks sentence readability and
          undercounts words. Rule 8.6 already treats numbers, abbreviations, identifiers, and
          quoted text as a single word each; extending that treatment to inline code spans
          keeps word counting consistent while excluding non-prose technical literals from
          grammar-sensitive checks that would otherwise produce false positives.
        tests:
          - Extract_InlineCodeSpan_KeptVerbatimInProse
          - Extract_FencedCodeBlock_ExcludedFromProse
          - CountWords_InlineCodeSpan_CountsAsOneWord
          - Split_SentenceWithInlineCodeSpan_KeepsVerbatimText
          - Evaluate_SemicolonOnlyInsideInlineCode_NoDiagnostic
          - Evaluate_ContractionOnlyInsideInlineCode_NoDiagnostic
          - Evaluate_PassiveVoiceOnlyInsideInlineCode_NoDiagnostic
          - Evaluate_ComplexVerbOnlyInsideInlineCode_NoDiagnostic
          - Evaluate_IngWordOnlyInsideInlineCode_NoDiagnostic
          - Evaluate_WordLimitDiagnosticMessage_ShowsInlineCodeVerbatim
          - Evaluate_DisallowedTermOnlyInsideInlineCode_NotFlagged
          - Evaluate_DisallowedTermInsideAndOutsideInlineCode_FlagsOnlyProseOccurrence

      - id: Ste100Mark-Linting-DictionaryPos
        title: >-
          The Linting subsystem shall select the applicable part-of-speech-tagged sense(s) of a
          disallowed term using a deterministic heuristic - including recognizing a determiner
          that governs the match through an intervening adjective/participle/proper-noun
          modifier, and a match followed by a finite verb form - suppressing the match when the
          heuristic confidently resolves a role that none of the term's senses restrict, and
          reporting every remaining sense as ambiguous when the heuristic cannot decide
          confidently.
        justification: |
          A single disallowed term can have distinct noun and verb senses with different
          approved alternatives (for example "impact" as a noun versus as a verb), and some
          terms restrict only one grammatical role (for example a verb-only entry). Reporting
          the wrong sense's alternative, or reporting a term used in a role it does not
          restrict, would be misleading. Technical writing is dense with noun phrases built from
          modifiers (for example "the metering probe" or "the Vantage probe"), and the
          heuristic must recognize a determiner's reach through such a modifier, not just an
          immediately preceding word, to avoid over-reporting subject nouns as unqualified
          matches. The subsystem must use surrounding sentence context to pick the correct
          sense (or determine that no sense applies) when possible, and fall back to reporting
          every remaining sense, clearly labeled as ambiguous, when the context does not
          confidently indicate one grammatical role.
        tests:
          - Guess_PrecededByTo_ReturnsVerb
          - Guess_PrecededByModal_ReturnsVerb
          - Guess_PrecededByBeAuxiliaryWithIngSuffix_ReturnsVerb
          - Guess_InflectionSuffixAlone_ReturnsVerb
          - Guess_ImperativeSentenceStartInProcedureMode_ReturnsVerb
          - Guess_SentenceStartInDescriptiveMode_ReturnsNull
          - Guess_PrecededByArticle_ReturnsNoun
          - Guess_PrecededByPossessive_ReturnsNoun
          - Guess_PrecededByQuantifier_ReturnsNoun
          - Guess_PrecededByPreposition_ReturnsNoun
          - Guess_PluralSuffix_ReturnsNoun
          - Guess_FollowedByOf_ReturnsNoun
          - Guess_ConflictingSignals_ReturnsNull
          - Guess_NoSignals_ReturnsNull
          - Guess_ArticleThenParticipleModifier_ReturnsNoun
          - Guess_ArticleThenProperNounModifier_ReturnsNoun
          - Guess_ArticleThenAdjectiveModifier_ReturnsNoun
          - Guess_DeterminerBeyondMaxScanDistance_DoesNotGovern
          - Guess_FollowedByFiniteVerb_ReturnsNoun
          - Evaluate_SingleSenseTerm_InconclusiveContext_ReportedWithoutPosLabel
          - Evaluate_SingleSenseVerbOnlyTerm_ConfidentNounContext_NotFlagged
          - Evaluate_MultiSenseTerm_ConfidentGuessMatchesNoSense_NotFlagged
          - Evaluate_MultiSenseTerm_NounContext_ReportsNounSense
          - Evaluate_MultiSenseTerm_VerbContext_ReportsVerbSense
          - Evaluate_MultiSenseTerm_AmbiguousContext_ReportsAllSensesAmbiguous
          - Evaluate_AnyPosSingleSenseTerm_AlwaysReported
          - Evaluate_ConfidentSenseSingleAlternative_NoOrInMessage
          - Evaluate_ConfidentSenseTwoAlternatives_JoinsWithOrNoOxfordComma
          - Evaluate_ConfidentSenseThreeOrMoreAlternatives_JoinsWithOxfordCommaBeforeOr
          - Evaluate_AmbiguousMultiSenseTerm_GroupsAlternativesPerSenseWithNaturalJoin

      - id: Ste100Mark-Linting-AccurateLineNumbers
        title: >-
          The Linting subsystem shall report each diagnostic against the source line on which its
          violation actually occurs, even when the violation is found within a multi-line
          paragraph, rather than always reporting the paragraph's first line.
        justification: |
          A Markdown paragraph spanning several source lines is folded into a single prose
          segment for sentence and dictionary analysis. Reporting every finding at the segment's
          first line regardless of where the violating sentence, word, or term actually appears
          misleads the user about which line to edit, especially in long paragraphs. Diagnostics
          for word-limit, semicolon, contraction, passive-voice, complex-verb, -ing form, and
          dictionary findings must resolve the true source line from the character offset of the
          match or sentence within the segment. A paragraph-length finding remains an exception,
          since it concerns the whole paragraph and is correctly reported at its start line.
        tests:
          - Extract_MultiLineParagraph_ResolveLineReportsEachLinesOwnLineNumber
          - Extract_SingleLineSegment_ResolveLineAlwaysReturnsSegmentLine
          - Evaluate_LongSentenceOnLaterLineOfMultiLineParagraph_ReportsThatLine
          - Evaluate_SemicolonOnLaterLineOfMultiLineParagraph_ReportsThatLine
          - Evaluate_ContractionOnLaterLineOfMultiLineParagraph_ReportsThatLine
          - Evaluate_IngFormOnLaterLineOfMultiLineParagraph_ReportsThatLine
          - Evaluate_DisallowedTermOnLaterLineOfMultiLineParagraph_ReportsThatLine

      - id: Ste100Mark-Linting-Configuration
        title: >-
          The Linting subsystem shall load YAML configuration for include/exclude patterns,
          default mode, rule tuning, and dictionary settings.
        justification: |
          Projects need a repeatable way to control file scope, default writing mode, rule
          severity, and vocabulary policy without recompiling the tool. YAML configuration
          provides a human-editable, repository-local contract for those settings.
        tests:
          - Load_NullPath_ReturnsDefaultConfiguration
          - Load_NonExistentPath_ThrowsInvalidOperationException
          - Load_FullConfigurationFile_ParsesAllSections
          - Load_MalformedYaml_ThrowsInvalidOperationException

      - id: Ste100Mark-Linting-Profiles
        title: >-
          The Linting subsystem shall resolve per-file writing mode, rule tuning, and dictionary
          allowances from glob-scoped profiles, using first-match-wins for mode and layered
          deltas for rules and dictionary allowances.
        justification: |
          A repository often mixes document types with different requirements: procedural
          guides need a shorter sentence limit, while a requirements folder legitimately uses
          restricted words such as "shall" in every entry. Profiles let a project express these
          differences per glob without duplicating the whole configuration file, and without
          weakening vocabulary or rule enforcement for the rest of the project.
        tests:
          - ResolveMode_NoMatchingProfile_ReturnsDefaultMode
          - ResolveMode_MatchingProfileGlob_ReturnsOverriddenMode
          - ResolveMode_MultipleProfiles_UsesFirstMatch
          - ResolveMode_MatchingProfileWithNullMode_FallsThroughToDefault
          - ResolveRules_NoMatchingProfile_ReturnsGlobalRules
          - ResolveRules_MatchingProfile_LayersDeltaOverGlobalRules
          - ResolveRules_MultipleMatchingProfiles_LayersAllDeltasInOrder
          - ResolveAllowedTerms_NoMatchingProfile_ReturnsGlobalTermsOnly
          - ResolveAllowedTerms_MatchingProfile_UnionsWithGlobalAllowList
          - Run_ProcedureModeOverride_AppliesStricterWordLimit
          - Run_ProfileDictionaryAllowList_PermitsTermOnlyWithinProfileGlob
          - Evaluate_TermInExtraAllowedTerms_NotFlagged
          - Evaluate_ExtraAllowedTermsDifferentCasing_StillSuppressesDiagnostic
          - Evaluate_ExtraAllowedTermsUnrelatedTerm_StillFlagsOtherDisallowedTerm

      - id: Ste100Mark-Linting-CliIntegration
        title: >-
          The Linting subsystem shall accept positional globs and the lint-specific command-line
          options required to drive one lint invocation.
        justification: |
          The default tool path must be controllable from the command line so users and CI
          jobs can choose file scope, configuration file, output format, and strict-mode
          behavior for each run.
        tests:
          - Context_Create_NoArguments_ReturnsLintingDefaults
          - Context_Create_PositionalArgument_CollectedAsGlob
          - Context_Create_MultiplePositionalArguments_CollectedInOrder
          - Context_Create_ConfigFlag_SetsConfigFile
          - Context_Create_ConfigFlag_WithoutValue_ThrowsArgumentException
          - Context_Create_FormatFlagJson_SetsJsonFormat
          - Context_Create_FormatFlagText_SetsTextFormat
          - Context_Create_FormatFlag_UnsupportedValue_ThrowsArgumentException
          - Context_Create_FormatFlag_WithoutValue_ThrowsArgumentException
          - Context_Create_StrictFlag_SetsStrictTrue
          - Program_Run_NoArguments_DisplaysDefaultBehavior
          - Run_PositionalGlobs_OverrideConfigInclude

      - id: Ste100Mark-Linting-OutputFormats
        title: The Linting subsystem shall report diagnostics in human-readable text and structured JSON formats.
        justification: |
          Human users need readable console diagnostics, while CI systems need a stable
          machine-readable schema. The subsystem must provide both without mixing banner text
          into JSON output.
        tests:
          - Report_TextFormat_WritesDiagnosticLinesAndSummary
          - Report_JsonFormat_WritesSingleJsonDocumentWithExpectedSchema
          - Report_NoDiagnostics_WritesZeroCountSummary
          - Ste100Mark_LintWithJsonFormat_ProducesSingleValidJsonDocument

      - id: Ste100Mark-Linting-ExitCode
        title: >-
          The Linting subsystem shall return a non-zero exit code for error-severity findings,
          expected configuration failures, and warn-severity findings when `--strict` is active.
        justification: |
          CI/CD pipelines must be able to fail builds on lint problems and configuration
          defects programmatically. Strict mode also lets a project temporarily promote all
          warnings to failing conditions without changing the reported severities.
        tests:
          - Run_CleanMarkdownFile_ProducesSuccessExitCode
          - Run_FileWithSemicolon_ProducesFailureExitCode
          - Run_WarnOnlyFinding_WithoutStrict_ProducesSuccessExitCode
          - Run_WarnOnlyFinding_WithStrict_ProducesFailureExitCode
          - Run_MissingExplicitConfigFile_ReportsErrorWithoutThrowing
          - Context_MarkFailure_SetsExitCodeWithoutConsoleOutput
          - Ste100Mark_LintCleanFile_ReturnsZeroExitCode
          - Ste100Mark_LintWithStrictFlag_PromotesWarningsToFailure
          - Ste100Mark_LintWithMissingConfigFile_ReturnsNonZeroWithErrorMessage
