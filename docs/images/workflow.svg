<svg xmlns="http://www.w3.org/2000/svg" width="1076" height="420" viewBox="0 0 1076 420" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <!-- Transparent canvas; a white rounded card keeps the diagram readable in light and dark themes -->
  <rect x="14" y="16" width="1050" height="398" rx="28" fill="#d5dce6"/>
  <rect x="10" y="10" width="1050" height="398" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <g transform="translate(30,34)">
    <!-- Step 1: prepare -->
    <rect x="0" y="0" width="230" height="306" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="115" y="30" font-size="16" font-weight="600" fill="#1e3a8a" text-anchor="middle">1. Prepare your docs</text>
    <rect x="14" y="46" width="202" height="54" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="115" y="68" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">Markdown files</text>
    <text x="115" y="88" font-size="12" fill="#1e40af" text-anchor="middle">the prose you want to check</text>
    <rect x="14" y="110" width="202" height="54" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="115" y="132" font-size="14" font-weight="600" font-family="Consolas, monospace" fill="#1e3a8a" text-anchor="middle">.ste100mark.yaml</text>
    <text x="115" y="152" font-size="12" fill="#1e40af" text-anchor="middle">include, exclude, and rule settings</text>
    <rect x="14" y="174" width="202" height="54" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="115" y="196" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">Profiles</text>
    <text x="115" y="216" font-size="12" fill="#1e40af" text-anchor="middle">per-glob mode, rules, and terms</text>
    <rect x="14" y="238" width="202" height="54" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="115" y="260" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">Dictionary file</text>
    <text x="115" y="280" font-size="12" fill="#1e40af" text-anchor="middle">your licensed ASD-STE100 terms</text>

    <line x1="234" y1="153" x2="256" y2="153" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <!-- Step 2: run -->
    <rect x="260" y="0" width="230" height="306" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="375" y="30" font-size="16" font-weight="600" fill="#92400e" text-anchor="middle">2. Run Ste100Mark</text>
    <rect x="274" y="46" width="202" height="54" rx="6" fill="#ffffff" stroke="#d97706"/>
    <text x="375" y="68" font-size="14" font-weight="600" font-family="Consolas, monospace" fill="#92400e" text-anchor="middle">ste100mark [globs]</text>
    <text x="375" y="88" font-size="12" fill="#92400e" text-anchor="middle">or the configured include list</text>
    <rect x="274" y="110" width="202" height="54" rx="6" fill="#ffffff" stroke="#d97706"/>
    <text x="375" y="132" font-size="14" font-weight="600" font-family="Consolas, monospace" fill="#92400e" text-anchor="middle">--config</text>
    <text x="375" y="152" font-size="12" fill="#92400e" text-anchor="middle">use an explicit configuration file</text>
    <rect x="274" y="174" width="202" height="54" rx="6" fill="#ffffff" stroke="#d97706"/>
    <text x="375" y="196" font-size="14" font-weight="600" font-family="Consolas, monospace" fill="#92400e" text-anchor="middle">--format text|json</text>
    <text x="375" y="216" font-size="12" fill="#92400e" text-anchor="middle">readable or machine-readable</text>
    <rect x="274" y="238" width="202" height="54" rx="6" fill="#ffffff" stroke="#d97706"/>
    <text x="375" y="260" font-size="14" font-weight="600" font-family="Consolas, monospace" fill="#92400e" text-anchor="middle">--strict</text>
    <text x="375" y="280" font-size="12" fill="#92400e" text-anchor="middle">fail on warn-severity findings</text>

    <line x1="494" y1="153" x2="516" y2="153" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <!-- Step 3: outputs -->
    <rect x="520" y="0" width="230" height="306" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="635" y="30" font-size="16" font-weight="600" fill="#5b21b6" text-anchor="middle">3. Get the findings</text>
    <rect x="534" y="46" width="202" height="54" rx="6" fill="#ffffff" stroke="#7c3aed"/>
    <text x="635" y="68" font-size="14" font-weight="600" fill="#4c1d95" text-anchor="middle">Text or JSON diagnostics</text>
    <text x="635" y="88" font-size="12" fill="#5b21b6" text-anchor="middle">file, line, severity, rule, message</text>
    <rect x="534" y="110" width="202" height="54" rx="6" fill="#ffffff" stroke="#7c3aed"/>
    <text x="635" y="132" font-size="14" font-weight="600" fill="#4c1d95" text-anchor="middle">Rule codes and suggestions</text>
    <text x="635" y="152" font-size="12" font-family="Consolas, monospace" fill="#5b21b6" text-anchor="middle">STE100-4.1, STE100-DICT</text>
    <rect x="534" y="174" width="202" height="54" rx="6" fill="#ffffff" stroke="#7c3aed"/>
    <text x="635" y="196" font-size="14" font-weight="600" fill="#4c1d95" text-anchor="middle">Run summary</text>
    <text x="635" y="216" font-size="12" fill="#5b21b6" text-anchor="middle">files checked, errors, warnings</text>
    <rect x="534" y="238" width="202" height="54" rx="6" fill="#ffffff" stroke="#7c3aed"/>
    <text x="635" y="260" font-size="14" font-weight="600" fill="#4c1d95" text-anchor="middle">Exit code</text>
    <text x="635" y="280" font-size="12" fill="#5b21b6" text-anchor="middle">0 pass, 1 fail, 2 no files matched</text>

    <line x1="754" y1="153" x2="776" y2="153" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <!-- Step 4: use -->
    <rect x="780" y="0" width="230" height="306" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="895" y="30" font-size="16" font-weight="600" fill="#166534" text-anchor="middle">4. Use them</text>
    <rect x="794" y="46" width="202" height="54" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="895" y="68" font-size="14" font-weight="600" fill="#14532d" text-anchor="middle">CI writing-quality gate</text>
    <text x="895" y="88" font-size="12" fill="#166534" text-anchor="middle">fail builds on rule violations</text>
    <rect x="794" y="110" width="202" height="54" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="895" y="132" font-size="14" font-weight="600" fill="#14532d" text-anchor="middle">Pull request reviews</text>
    <text x="895" y="152" font-size="12" fill="#166534" text-anchor="middle">fix the prose before merging</text>
    <rect x="794" y="174" width="202" height="54" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="895" y="196" font-size="14" font-weight="600" fill="#14532d" text-anchor="middle">Tool integration</text>
    <text x="895" y="216" font-size="12" fill="#166534" text-anchor="middle">feed JSON findings to other tools</text>
    <rect x="794" y="238" width="202" height="54" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="895" y="260" font-size="14" font-weight="600" fill="#14532d" text-anchor="middle">Clearer documentation</text>
    <text x="895" y="280" font-size="12" fill="#166534" text-anchor="middle">simple, consistent technical English</text>

    <text x="505" y="334" font-size="13" font-style="italic" fill="#475569" text-anchor="middle">List every rule code with ste100mark --list-rules</text>
    <text x="505" y="356" font-size="13" font-style="italic" fill="#475569" text-anchor="middle">Need tool qualification evidence? Run ste100mark --validate --results validation-results.trx</text>
  </g>
</svg>
