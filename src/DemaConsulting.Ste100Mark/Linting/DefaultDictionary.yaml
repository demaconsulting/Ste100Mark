# ---------------------------------------------------------------------------
# Ste100Mark - Illustrative Default Dictionary
# ---------------------------------------------------------------------------
# IMPORTANT - READ BEFORE USE:
#
# This file is a SMALL, ORIGINALLY-AUTHORED, REPRESENTATIVE EXAMPLE of the
# kind of word-substitution list used by ASD-STE100 (Simplified Technical
# English) Issue 9. It was written from scratch for this open-source project
# and is NOT the official ASD-STE100 Part 2 Dictionary.
#
# The genuine ASD-STE100 Part 2 Dictionary is commercially-licensed content
# owned by ASD (Aerospace, Security and Defence Industries Association of
# Europe). This repository is public and published to NuGet, so
# redistributing ASD's dictionary content would infringe ASD's copyright.
# Nothing in this file was transcribed or derived from the official
# ASD-STE100 PDF or any other licensed source.
#
# Projects that require true ASD-STE100 Issue 9 compliance MUST supply their
# own licensed dictionary file via the `dictionary.file` option in
# `.ste100mark.yaml`, and SHOULD disable this illustrative dictionary with
# `dictionary.use-embedded: false` to avoid mixing illustrative guidance with
# officially approved/disallowed vocabulary.
#
# Schema: each top-level key is a disallowed term (case-insensitive, matched
# as a whole word or phrase). Each value is a LIST of one or more senses.
# Each sense has a `pos` (part of speech: `noun`, `verb`, `adjective`,
# `adverb`, or `any` for a role-independent connector), an `alternatives`
# list of suggested replacements for that sense, and an optional free-text
# `note`. Every match is checked against a best-effort part-of-speech
# heuristic: when the heuristic confidently resolves a role (noun or verb)
# that none of the term's senses restrict, the match is not reported (the
# word is not being used in a disallowed role here). When the heuristic
# cannot decide confidently, every remaining candidate sense is reported,
# labeled as ambiguous.
# ---------------------------------------------------------------------------

