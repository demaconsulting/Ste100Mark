---
# Spell-Checking with TextLint
#
# PURPOSE:
# - Maintain professional documentation and code quality
# - Catch spelling errors before publication
# - Support consistent technical terminology usage
# - Misspelled words should be fixed in the source
# - NEVER add a misspelled word to the 'words' list
# - PROPOSE only genuine technical terms/names as needed

version: "0.2"
language: en

# The files TextLint spell-checks
enableGlobDot: true
files:
  - "**/*.{md,yaml,yml,json,cs,cpp,hpp,h,txt}"

# Project-specific technical terms and tool names
words:
  - backticked
  - catenative
  - Catenative
  - Christiane
  - COMPLEXVERB
  - Crae
  - deenergized
  - Defence
  - DEMA
  - Dema
  - demaconsulting
  - deverbal
  - endeavour
  - Fellbaum
  - froobnicate
  - INGFORM
  - licence
  - LREC
  - metacharacter
  - Moby
  - ncipollo
  - nestings
  - netstandard
  - NOAA
  - nominalized
  - OANC
  - parentheticals
  - Parentheticals
  - Passonneau
  - prenominal
  - Propn
  - Sarif
  - sarif
  - SARIF
  - Setext
  - shopt
  - slnx
  - snupkg
  - sonarscanner
  - Tatoeba
  - thirdparty
  - Treebank
  - turbopump
  - unidirectionality
  - unioned
  - unioning
  - unpowered
  - USGS
  - utilise
  - venv
  - yamldotnet
  - yamlfix

# Exclude common build artifacts, dependencies, and vendored third-party code
ignorePaths:
  - "**/.git/**"
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/thirdparty/**"
  - "**/third-party/**"
  - "**/3rd-party/**"
  - "**/generated/**"
  - "**/AGENT_REPORT_*.md"
  - "**/.agent-logs/**"
  - "**/bin/**"
  - "**/obj/**"
  - package-lock.json
