---
# CodeQL configuration for Ste100Mark
# Suppresses intentional generic catch clauses

name: "Ste100Mark CodeQL Config"

# Query filters to disable specific queries for certain paths
query-filters:
  - exclude:
      id: cs/catch-of-all-exceptions
    paths:
      - src/DemaConsulting.Ste100Mark/Context.cs
      - src/DemaConsulting.Ste100Mark/Validation.cs
  # Exclude path-combine warnings in PathHelpers (validated safe usage)
  - exclude:
      id: cs/path-combine
    paths:
      - src/DemaConsulting.Ste100Mark/PathHelpers.cs
