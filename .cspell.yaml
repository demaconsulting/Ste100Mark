---
# Spell-Checking
#
# PURPOSE:
# - Maintain professional documentation and code quality
# - Catch spelling errors before publication
# - Support consistent technical terminology usage
# - Misspelled words should be fixed in the source
# - NEVER add a misspelled word to the 'words' list
# - PROPOSE only genuine technical terms/names as needed

version: "0.2"
language: en

# Project-specific technical terms and tool names
words:
  - backticked
  - Blockquotes
  - buildmark
  - buildtransitive
  - COMPLEXVERB
  - contentfiles
  - dcterms
  - DEMA
  - Defence
  - Dema
  - demaconsulting
  - doctitle
  - docversion
  - errorlevel
  - fileassert
  - froobnicate
  - INGFORM
  - licence
  - LINQ
  - metacharacter
  - metacharacters
  - xunit
  - nameof
  - nominalized
  - pagetitle
  - Pandoc
  - parentheticals
  - Postconditions
  - Qube
  - reqstream
  - reviewmark
  - SARIF
  - sarifmark
  - setlocal
  - snupkg
  - sonarmark
  - sysml
  - sysml2tools
  - ste100mark
  - undercounts
  - unioned
  - unioning
  - utilise
  - venv
  - versionmark
  - Weasyprint
  - yamldotnet
  - yamlfix

# Exclude common build artifacts, dependencies, and vendored third-party code
ignorePaths:
  - "**/.git/**"
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/thirdparty/**"
  - "**/third-party/**"
  - "**/3rd-party/**"
  - "**/generated/**"
  - "**/AGENT_REPORT_*.md"
  - "**/.agent-logs/**"
  - "**/bin/**"
  - "**/obj/**"
  - package-lock.json
